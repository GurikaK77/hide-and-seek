<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>დამალობანა - Hide & Seek</title>
  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <!-- Leaflet CSS + JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #1e1e2f; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    #app { width: 100%; max-width: 420px; margin: 10px; background: #2a2a3d; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .hidden { display: none !important; }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 10px; font-size: 16px; }
    button { background: #5c6bc0; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.97); }
    button.secondary { background: #3d3d50; }
    .card { background: #3a3a4f; padding: 15px; border-radius: 15px; margin: 10px 0; }
    #map { height: 250px; border-radius: 12px; margin: 10px 0; }
    .timer { font-size: 2rem; text-align: center; margin: 10px 0; }
    .player-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .player-badge { background: #5c6bc0; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
    .player-badge.seeker { background: #26a69a; }
    .player-badge.hider { background: #ef5350; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 24px; border-radius: 30px; z-index: 999; }
  </style>
</head>
<body>
  <div id="app">
    <!-- LOGIN -->
    <div id="login-screen">
      <h2>🔐 შესვლა</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="პაროლი">
      <button id="email-signin">📧 შესვლა</button>
      <button id="email-signup" class="secondary">📝 რეგისტრაცია</button>
    </div>

    <!-- ROOM LIST -->
    <div id="lobby-screen" class="hidden">
      <h2>🏠 რუმები</h2>
      <div id="rooms-list"></div>
      <button id="create-room-btn">➕ ახალი რუმი</button>
      <div id="create-room-form" class="card hidden">
        <h3>შექმენი რუმი</h3>
        <input type="text" id="room-name" placeholder="რუმის სახელი">
        <input type="number" id="room-time" placeholder="თამაშის ხანგრძლივობა (წუთები)" min="1" value="10">
        <button id="save-room">💾 შენახვა</button>
      </div>
      <button id="logout-btn" class="secondary">🚪 გამოსვლა</button>
    </div>

    <!-- ROOM DETAIL -->
    <div id="room-screen" class="hidden">
      <h2 id="room-title"></h2>
      <div id="room-admin-panel" class="card hidden">
        <h3>🎛️ Admin პანელი</h3>
        <input type="email" id="player-email" placeholder="მოთამაშის email">
        <select id="player-role"><option value="seeker">🔍 მძებნელი</option><option value="hider">🙈 დამმალველი</option></select>
        <button id="add-player-btn">➕ დამატება</button>
        <div id="room-players" class="player-list"></div>
        <hr style="margin:10px 0;">
        <label>
          <input type="checkbox" id="location-detect"> 📍 Location Detect
        </label>
        <input type="number" id="location-interval" placeholder="ინტერვალი (წთ)" value="5" min="1">
        <button id="start-game-btn" class="secondary">▶️ თამაშის დაწყება</button>
      </div>
      <div id="room-player-view" class="hidden">
        <p>შენი როლი: <strong id="my-role"></strong></p>
        <button id="join-room-btn" class="hidden">✅ რუმში შესვლა</button>
      </div>
      <button id="back-to-lobby" class="secondary">⬅️ უკან</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden">
      <h2 id="game-room-name"></h2>
      <div class="timer" id="timer-display">00:00</div>
      <div id="map"></div>
      <div id="game-players" class="player-list"></div>
      <button id="leave-game-btn" class="secondary">🚪 თამაშის დატოვება</button>
    </div>
  </div>

  <script>
    // 🔽 ჩასვი შენი Firebase კონფიგი
    const firebaseConfig = {
  apiKey: "AIzaSyAdfjmzArx4csbEaTfY6UzPfFmjxVWiTB8",
  authDomain: "hide-and-seek-3630d.firebaseapp.com",
  databaseURL: "https://hide-and-seek-3630d-default-rtdb.firebaseio.com",
  projectId: "hide-and-seek-3630d",
  storageBucket: "hide-and-seek-3630d.firebasestorage.app",
  messagingSenderId: "115485369431",
  appId: "1:115485369431:web:cf6126ab8ab30ae7662f12",
  measurementId: "G-GR1DBV3Z70"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database(); // Realtime Database

    // UI
    const screens = {
      login: document.getElementById('login-screen'),
      lobby: document.getElementById('lobby-screen'),
      room: document.getElementById('room-screen'),
      game: document.getElementById('game-screen')
    };
    function showScreen(screen) {
      Object.values(screens).forEach(s => s.classList.add('hidden'));
      if (screens[screen]) screens[screen].classList.remove('hidden');
    }
    function toast(msg) {
      const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    // Auth
    document.getElementById('email-signin').onclick = () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, pass).catch(e => toast(e.message));
    };
    document.getElementById('email-signup').onclick = () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, pass).catch(e => toast(e.message));
    };
    document.getElementById('logout-btn').onclick = () => auth.signOut();

    let currentUser = null;
    let activeRoomId = null;
    let roomListener = null;
    let gameRoomListener = null;
    let locationTimer = null;
    let mapInstance = null;
    let mapMarkers = {};

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        showScreen('lobby');
        loadRooms();
      } else {
        currentUser = null;
        showScreen('login');
        stopAllListeners();
      }
    });

    function stopAllListeners() {
      if (roomListener) { roomListener(); roomListener = null; }
      if (gameRoomListener) { gameRoomListener(); gameRoomListener = null; }
      if (locationTimer) clearInterval(locationTimer);
    }

    // --- Lobby ---
    function loadRooms() {
      db.ref('rooms').on('value', snapshot => {
        const list = document.getElementById('rooms-list');
        list.innerHTML = '';
        const rooms = snapshot.val();
        if (rooms) {
          Object.entries(rooms).forEach(([id, room]) => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<strong>${room.name}</strong> | Admin: ${room.adminName || '???'} | ${room.gameState || 'waiting'}`;
            div.onclick = () => openRoom(id);
            list.appendChild(div);
          });
        }
      });
    }

    document.getElementById('create-room-btn').onclick = () => {
      document.getElementById('create-room-form').classList.toggle('hidden');
    };
    document.getElementById('save-room').onclick = async () => {
      const name = document.getElementById('room-name').value.trim();
      const time = parseInt(document.getElementById('room-time').value) || 10;
      if (!name) return toast('შეიყვანე სახელი');
      const newRoomRef = db.ref('rooms').push();
      await newRoomRef.set({
        name,
        totalTime: time * 60,
        adminId: currentUser.uid,
        adminName: currentUser.displayName || currentUser.email,
        gameState: 'waiting',
        locationDetection: { enabled: false, interval: 5 },
        players: {}
      });
      document.getElementById('create-room-form').classList.add('hidden');
      document.getElementById('room-name').value = '';
      toast('რუმი შექმნილია');
    };

    // --- Room Detail ---
    function openRoom(roomId) {
      activeRoomId = roomId;
      showScreen('room');
      if (roomListener) roomListener();
      roomListener = db.ref('rooms/' + roomId).on('value', snapshot => {
        const room = snapshot.val();
        if (!room) { showScreen('lobby'); return; }
        document.getElementById('room-title').textContent = room.name;
        const isAdmin = room.adminId === currentUser.uid;
        const adminPanel = document.getElementById('room-admin-panel');
        const playerView = document.getElementById('room-player-view');
        const joinBtn = document.getElementById('join-room-btn');
        
        if (isAdmin) {
          adminPanel.classList.remove('hidden');
          playerView.classList.add('hidden');
          document.getElementById('location-detect').checked = room.locationDetection?.enabled || false;
          document.getElementById('location-interval').value = room.locationDetection?.interval || 5;
          renderPlayers(room.players);
        } else {
          adminPanel.classList.add('hidden');
          playerView.classList.remove('hidden');
          const myEmail = currentUser.email?.toLowerCase();
          const myPlayer = room.players?.[myEmail];
          if (myPlayer) {
            document.getElementById('my-role').textContent = myPlayer.role === 'seeker' ? 'მძებნელი' : 'დამმალველი';
            if (!myPlayer.joined) {
              joinBtn.classList.remove('hidden');
              joinBtn.onclick = () => {
                db.ref(`rooms/${roomId}/players/${myEmail}`).update({
                  uid: currentUser.uid,
                  joined: true
                });
              };
            } else {
              joinBtn.classList.add('hidden');
            }
          } else {
            playerView.innerHTML = '<p>თქვენ არ ხართ ამ რუმის მოთამაშე.</p>';
          }
        }
        if (room.gameState === 'playing' && currentUser) {
          const email = currentUser.email?.toLowerCase();
          if (room.players?.[email]?.joined) {
            startGameScreen(roomId);
          }
        }
      });
    }

    function renderPlayers(players) {
      const container = document.getElementById('room-players');
      container.innerHTML = '';
      for (let email in players) {
        const p = players[email];
        const badge = document.createElement('span');
        badge.className = `player-badge ${p.role}`;
        badge.textContent = `${email} (${p.role==='seeker'?'🔍':'🙈'}) ${p.joined?'✅':'❌'}`;
        container.appendChild(badge);
      }
    }

    document.getElementById('add-player-btn').onclick = () => {
      const email = document.getElementById('player-email').value.trim().toLowerCase();
      const role = document.getElementById('player-role').value;
      if (!email) return toast('შეიყვანე email');
      db.ref(`rooms/${activeRoomId}/players/${email}`).set({
        role, uid: null, joined: false
      });
      document.getElementById('player-email').value = '';
      toast('მოთამაშე დაემატა');
    };

    document.getElementById('location-detect').onchange = function() {
      db.ref(`rooms/${activeRoomId}/locationDetection/enabled`).set(this.checked);
    };
    document.getElementById('location-interval').onchange = function() {
      const val = parseInt(this.value) || 5;
      db.ref(`rooms/${activeRoomId}/locationDetection/interval`).set(val);
    };

    document.getElementById('start-game-btn').onclick = () => {
      db.ref(`rooms/${activeRoomId}`).update({
        gameState: 'playing',
        startTime: firebase.database.ServerValue.TIMESTAMP
      });
      toast('თამაში დაიწყო!');
    };

    document.getElementById('back-to-lobby').onclick = () => {
      if (roomListener) roomListener();
      roomListener = null;
      activeRoomId = null;
      showScreen('lobby');
    };

    // --- Game Screen ---
    function startGameScreen(roomId) {
      if (roomListener) roomListener();
      if (gameRoomListener) gameRoomListener();
      gameRoomListener = db.ref('rooms/' + roomId).on('value', snapshot => {
        const room = snapshot.val();
        if (!room || room.gameState !== 'playing') {
          stopGame();
          showScreen('lobby');
          return;
        }
        document.getElementById('game-room-name').textContent = room.name;
        updateTimer(room);
        updateGamePlayers(room);
        if (room.locationDetection?.enabled) {
          handleLocationPing(roomId);
        }
      });
      showScreen('game');
      initMap();
      startLocationInterval(roomId);
    }

    function stopGame() {
      if (gameRoomListener) { gameRoomListener(); gameRoomListener = null; }
      if (locationTimer) clearInterval(locationTimer);
      if (mapInstance) { mapInstance.remove(); mapInstance = null; mapMarkers = {}; }
    }

    document.getElementById('leave-game-btn').onclick = () => {
      stopGame();
      showScreen('lobby');
    };

    function initMap() {
      if (mapInstance) return;
      const mapEl = document.getElementById('map');
      mapInstance = L.map('map').setView([41.7151, 44.8271], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(mapInstance);
      setTimeout(() => mapInstance.invalidateSize(), 100);
    }

    function updateTimer(room) {
      const timerEl = document.getElementById('timer-display');
      if (!room.startTime) { timerEl.textContent = '00:00'; return; }
      const start = room.startTime;
      const totalSec = room.totalTime || 600;
      const now = Date.now();
      const diff = (start + totalSec * 1000) - now;
      if (diff <= 0) {
        timerEl.textContent = '00:00';
        db.ref(`rooms/${activeRoomId}/gameState`).set('ended');
        return;
      }
      const mins = Math.floor(diff / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      timerEl.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function updateGamePlayers(room) {
      const container = document.getElementById('game-players');
      container.innerHTML = '';
      for (let email in room.players) {
        const p = room.players[email];
        if (p.joined) {
          const badge = document.createElement('span');
          badge.className = `player-badge ${p.role}`;
          badge.textContent = email;
          container.appendChild(badge);
        }
      }
    }

    function startLocationInterval(roomId) {
      if (locationTimer) clearInterval(locationTimer);
      const email = currentUser.email?.toLowerCase();
      db.ref('rooms/' + roomId).once('value', snap => {
        const room = snap.val();
        if (room?.players?.[email]?.role !== 'hider') return;
        if (!room.locationDetection?.enabled) return;
        const intervalMin = room.locationDetection.interval || 5;
        sendLocationNow(roomId, email);
        locationTimer = setInterval(() => sendLocationNow(roomId, email), intervalMin * 60000);
      });
    }

    function sendLocationNow(roomId, email) {
      if (!navigator.geolocation) { toast('Geolocation არ არის'); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        db.ref(`rooms/${roomId}/locations`).push({
          email,
          lat: latitude,
          lng: longitude,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
      }, err => toast('ლოკაციის მიღება ვერ მოხერხდა'), { enableHighAccuracy: true });
    }

    function handleLocationPing(roomId) {
      if (!mapInstance) initMap();
      const email = currentUser.email?.toLowerCase();
      db.ref('rooms/' + roomId).once('value', snap => {
        const room = snap.val();
        if (room?.players?.[email]?.role !== 'seeker') return;
        db.ref(`rooms/${roomId}/locations`).limitToLast(50).on('value', locSnap => {
          const locations = locSnap.val();
          const latest = {};
          if (locations) {
            Object.values(locations).forEach(loc => {
              if (!latest[loc.email] || loc.timestamp > latest[loc.email].timestamp) {
                latest[loc.email] = loc;
              }
            });
          }
          for (let hEmail in latest) {
            const loc = latest[hEmail];
            if (mapMarkers[hEmail]) {
              mapMarkers[hEmail].setLatLng([loc.lat, loc.lng]);
            } else {
              const marker = L.marker([loc.lat, loc.lng]).addTo(mapInstance)
                .bindPopup(`${hEmail} (${new Date(loc.timestamp).toLocaleTimeString()})`);
              mapMarkers[hEmail] = marker;
            }
          }
          for (let key in mapMarkers) {
            if (!latest[key]) {
              mapInstance.removeLayer(mapMarkers[key]);
              delete mapMarkers[key];
            }
          }
        });
      });
    }
  </script>
</body>
</html>
